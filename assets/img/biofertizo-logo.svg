<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <defs>
        <!-- Definición de la hoja base para reutilizar -->
        <g id="leaf">
            <!-- Hoja en forma de gota estilizada -->
            <path d="M 0,0 C 10,8 10,25 0,35 C -10,25 -10,8 0,0 Z" fill="#4CAF50" />
        </g>
    </defs>

    <!-- Grupo Isotipo (Árbol) -->
    <g id="isotipo" transform="translate(0, -20)">
        
        <!-- Tronco Central (Base recta y bordes suavizados) -->
        <path d="M 250,320 L 250,210" stroke="#795548" stroke-width="14" stroke-linecap="round" fill="none" />

        <!-- Ramas Nivel Inferior -->
        <path d="M 250,280 C 220,255 180,265 160,285" stroke="#795548" stroke-width="9" stroke-linecap="round" fill="none" />
        <path d="M 250,280 C 280,255 320,265 340,285" stroke="#795548" stroke-width="9" stroke-linecap="round" fill="none" />

        <!-- Ramas Nivel Medio -->
        <path d="M 250,250 C 225,230 195,240 175,255" stroke="#795548" stroke-width="8" stroke-linecap="round" fill="none" />
        <path d="M 250,250 C 275,230 305,240 325,255" stroke="#795548" stroke-width="8" stroke-linecap="round" fill="none" />

        <!-- Ramas Nivel Superior -->
        <path d="M 250,230 C 235,215 215,225 205,235" stroke="#795548" stroke-width="7" stroke-linecap="round" fill="none" />
        <path d="M 250,230 C 265,215 285,225 295,235" stroke="#795548" stroke-width="7" stroke-linecap="round" fill="none" />

        <!-- Copa: 7 Hojas (1 Central + 6 Laterales a 45°) -->
        <!-- Hoja Central Superior -->
        <use href="#leaf" transform="translate(250, 140)" />
        
        <!-- Par Superior -->
        <use href="#leaf" transform="translate(215, 175) rotate(-45)" />
        <use href="#leaf" transform="translate(285, 175) rotate(45)" />
        
        <!-- Par Medio -->
        <use href="#leaf" transform="translate(185, 200) rotate(-45)" />
        <use href="#leaf" transform="translate(315, 200) rotate(45)" />
        
        <!-- Par Inferior -->
        <use href="#leaf" transform="translate(155, 225) rotate(-45)" />
        <use href="#leaf" transform="translate(345, 225) rotate(45)" />
    </g>

    <!-- Grupo Tipografía -->
    <g id="tipografia" font-family="'Poppins', 'Montserrat', 'Inter', Arial, sans-serif">
        
        <!-- Nombre Principal: BIOFERTIZO -->
        <text 
            x="250" 
            y="385" 
            font-size="44" 
            font-weight="700" 
            fill="#4CAF50" 
            text-anchor="middle" 
            letter-spacing="2"
            dominant-baseline="middle"
        >
            BIOFERTIZO
        </text>

        <!-- Subtítulo: NUTRICIÓN ORGÁNICA -->
        <text 
            x="250" 
            y="430" 
            font-size="15" 
            font-weight="500" 
            fill="#2E7D32" 
            text-anchor="middle" 
            letter-spacing="6"
            dominant-baseline="middle"
        >
            NUTRICIÓN ORGÁNICA
        </text>
    </g>
</svg>